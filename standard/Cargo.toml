[package]
name = "ephys-rs-standard"
# ephys-rs's: its config patches save it.
version.workspace = true
edition = "2024"
description = "The standard components of ephys-rs: its node, edge and annotation types, themes and the rest"
publish = false

[lib]
# Its tests run with the framework's, which are of the whole program (see ../src/lib.rs).
test = false
doctest = false

