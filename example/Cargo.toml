[package]
name = "ephys-rs-example"
version = "0.1.0"
edition = "2024"
description = "The example program built on ephys-rs, which is what this repository releases"
publish = false

[[bin]]
name = "ephys-rs"
path = "src/main.rs"
# Its tests run with the library's, which can drive the whole app (see src/lib.rs).
test = false

[dependencies]
ephys-rs = { path = ".." }
chrono = "^0.4.40"
eframe = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
