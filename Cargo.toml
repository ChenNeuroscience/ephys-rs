[package]
name = "ephys-rs"
version = "0.1.0"
edition = "2024"
description = "Electrophysiology acquisition, processing and recording, built around a node graph"
publish = false

[dependencies]
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
log = "0.4"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "clipboard", "links", "persistence"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_commonmark = "0.26"
egui_plot = "0.38"
egui_tiles = "0.18"
libloading = "0.9"
rfd = "0.17"
sci-rs = { version = "0.4.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cansi = "2"
chrono = "^0.4.40"
egui_extras = { version = "0.37", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"
rustfft = "6.4.1"
dugong = "0.9.3"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
