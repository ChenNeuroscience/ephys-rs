[package]
name = "ephys-rs"
version = "0.1.0"
edition = "2024"
description = "Electrophysiology acquisition, processing and recording, built around a node graph"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "clipboard", "persistence"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_commonmark = "0.26"
egui_tiles = "0.18"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
