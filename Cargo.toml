[package]
name = "ephys-rs"
version.workspace = true
edition = "2024"
description = "Electrophysiology acquisition, processing and recording, built around a node graph"
publish = false

[workspace]
members = ["standard", "examples/chen-neuro"]
default-members = [".", "standard", "examples/chen-neuro"]

# The framework's and the standard components', which are released together: ephys-rs's version (see
# docs/development.md), counted up by the pre-commit hook.
[workspace.package]
version = "0.241.0"

# Versions shared by the framework, the standard components and builds.
[workspace.dependencies]
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
log = "0.4"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "clipboard", "links", "persistence"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_commonmark = "0.26"
egui_plot = "0.38"
egui_tiles = "0.18"
libloading = "0.9"
rfd = "0.17"
sci-rs = { version = "0.4.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cansi = "2"
chrono = "^0.4.40"
egui_extras = { version = "0.37", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"
dugong = "0.9.3"
arboard = { version = "3.7", default-features = false }
realfft = "3.5.1"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
cpal = "0.18.2"
regex = "1.13.1"
arc-swap = "1"
muda = "0.21"
# Without libudev, which Linux would need for it: the ports are found without it.
serialport = { version = "4.10", default-features = false }
ephys-rs = { path = "." }
ephys-rs-standard = { path = "standard" }

[dependencies]
crossbeam-channel.workspace = true
crossbeam-utils.workspace = true
log.workspace = true
eframe.workspace = true
egui.workspace = true
egui_commonmark.workspace = true
egui_plot.workspace = true
egui_tiles.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
cansi.workspace = true
chrono.workspace = true
egui_extras.workspace = true
image.workspace = true
dugong.workspace = true
arboard.workspace = true
fs4.workspace = true
arc-swap.workspace = true

[lints.rust]
# Set by the standard components' build script, whose source the tests build too.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(standard_crate)"] }

[dev-dependencies]
# The tests are of the whole program, so build the standard components' source too (see src/lib.rs).
libloading.workspace = true
sci-rs.workspace = true
base64.workspace = true
realfft.workspace = true
cpal.workspace = true
regex.workspace = true
serialport.workspace = true
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
# For making the README's tour (see scripts/make_tour.sh).
image = { version = "0.25", default-features = false, features = ["gif"] }

# Debug builds of the app, but optimised builds of its dependencies (egui and the rest), which are otherwise many
# times slower: only the first build takes longer.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
# Which line each function's at, for crash reports' backtraces (see ephys_rs::crash): no slower.
debug = "line-tables-only"

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
